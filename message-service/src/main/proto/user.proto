syntax = "proto3";

package userservice;

option java_multiple_files = true;
option java_package = "org.example.userservice.grpc";

service UserService {
  rpc GetUser (GetUserRequest) returns (UserResponse);
}

message GetUserRequest {
  string username = 1;
}

message UserResponse {
  int64 id = 1;
  string username = 2;
  string email = 3;
  string display_name = 4;
}