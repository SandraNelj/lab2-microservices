server.port=8082
spring.application.name=message-service

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/messagedb
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# gRPC Client
grpc.client.user-service.address=static://localhost:9090
grpc.client.user-service.negotiation-type=plaintext